<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="158" viewBox="0 0 1000 158" role="img" aria-labelledby="title description"><title id="title">Lesson workflow</title><desc id="description">Plan: Choose the next action -&gt; Act: Perform a bounded step -&gt; Observe: Read the actual result -&gt; Stop or repeat: Check success and limits</desc><g fill="#202a29" font-family="Arial, sans-serif" font-size="18"><rect x="24" y="24" width="220" height="110" fill="#eef5f2"/><text x="40" y="52" font-weight="600">Plan</text><text x="40" y="82" font-size="16">Choose the next action</text><text x="249" y="79" aria-hidden="true">&#8594;</text><rect x="268" y="24" width="220" height="110" fill="#fbeff1"/><text x="284" y="52" font-weight="600">Act</text><text x="284" y="82" font-size="16">Perform a bounded step</text><text x="493" y="79" aria-hidden="true">&#8594;</text><rect x="512" y="24" width="220" height="110" fill="#eef5f2"/><text x="528" y="52" font-weight="600">Observe</text><text x="528" y="82" font-size="16">Read the actual result</text><text x="737" y="79" aria-hidden="true">&#8594;</text><rect x="756" y="24" width="220" height="110" fill="#fbeff1"/><text x="772" y="52" font-weight="600">Stop or repeat</text><text x="772" y="82" font-size="16">Check success and</text><text x="772" y="105" font-size="16">limits</text></g></svg>
