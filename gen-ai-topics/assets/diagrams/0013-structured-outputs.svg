<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="158" viewBox="0 0 1000 158" role="img" aria-labelledby="title description"><title id="title">Lesson workflow</title><desc id="description">Source + schema: Message and output contract -&gt; Generate: Produce candidate JSON -&gt; Validate: Check shape, evidence and rules -&gt; Route or review: Use accepted data or escalate</desc><g fill="#202a29" font-family="Arial, sans-serif" font-size="18"><rect x="24" y="24" width="220" height="110" fill="#eef5f2"/><text x="40" y="52" font-weight="600">Source + schema</text><text x="40" y="82" font-size="16">Message and output</text><text x="40" y="105" font-size="16">contract</text><text x="249" y="79" aria-hidden="true">&#8594;</text><rect x="268" y="24" width="220" height="110" fill="#fbeff1"/><text x="284" y="52" font-weight="600">Generate</text><text x="284" y="82" font-size="16">Produce candidate JSON</text><text x="493" y="79" aria-hidden="true">&#8594;</text><rect x="512" y="24" width="220" height="110" fill="#eef5f2"/><text x="528" y="52" font-weight="600">Validate</text><text x="528" y="82" font-size="16">Check shape, evidence</text><text x="528" y="105" font-size="16">and rules</text><text x="737" y="79" aria-hidden="true">&#8594;</text><rect x="756" y="24" width="220" height="110" fill="#fbeff1"/><text x="772" y="52" font-weight="600">Route or review</text><text x="772" y="82" font-size="16">Use accepted data or</text><text x="772" y="105" font-size="16">escalate</text></g></svg>
