<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="158" viewBox="0 0 1000 158" role="img" aria-labelledby="title description"><title id="title">Lesson workflow</title><desc id="description">Examples: Collect reviewed training data -&gt; Train: Adapt the base model -&gt; Evaluate: Test on held-out cases -&gt; Monitor: Check production quality</desc><g fill="#202a29" font-family="Arial, sans-serif" font-size="18"><rect x="24" y="24" width="220" height="110" fill="#eef5f2"/><text x="40" y="52" font-weight="600">Examples</text><text x="40" y="82" font-size="16">Collect reviewed</text><text x="40" y="105" font-size="16">training data</text><text x="249" y="79" aria-hidden="true">&#8594;</text><rect x="268" y="24" width="220" height="110" fill="#fbeff1"/><text x="284" y="52" font-weight="600">Train</text><text x="284" y="82" font-size="16">Adapt the base model</text><text x="493" y="79" aria-hidden="true">&#8594;</text><rect x="512" y="24" width="220" height="110" fill="#eef5f2"/><text x="528" y="52" font-weight="600">Evaluate</text><text x="528" y="82" font-size="16">Test on held-out cases</text><text x="737" y="79" aria-hidden="true">&#8594;</text><rect x="756" y="24" width="220" height="110" fill="#fbeff1"/><text x="772" y="52" font-weight="600">Monitor</text><text x="772" y="82" font-size="16">Check production</text><text x="772" y="105" font-size="16">quality</text></g></svg>
