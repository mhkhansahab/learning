<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="135" viewBox="0 0 1000 135" role="img" aria-labelledby="title description"><title id="title">Lesson workflow</title><desc id="description">Trigger: Match a specific task -&gt; Workflow: Follow reusable steps -&gt; Tools: Use approved operations -&gt; Verify: Check the task outcome</desc><g fill="#202a29" font-family="Arial, sans-serif" font-size="18"><rect x="24" y="24" width="220" height="87" fill="#eef5f2"/><text x="40" y="52" font-weight="600">Trigger</text><text x="40" y="82" font-size="16">Match a specific task</text><text x="249" y="67.5" aria-hidden="true">&#8594;</text><rect x="268" y="24" width="220" height="87" fill="#fbeff1"/><text x="284" y="52" font-weight="600">Workflow</text><text x="284" y="82" font-size="16">Follow reusable steps</text><text x="493" y="67.5" aria-hidden="true">&#8594;</text><rect x="512" y="24" width="220" height="87" fill="#eef5f2"/><text x="528" y="52" font-weight="600">Tools</text><text x="528" y="82" font-size="16">Use approved operations</text><text x="737" y="67.5" aria-hidden="true">&#8594;</text><rect x="756" y="24" width="220" height="87" fill="#fbeff1"/><text x="772" y="52" font-weight="600">Verify</text><text x="772" y="82" font-size="16">Check the task outcome</text></g></svg>
