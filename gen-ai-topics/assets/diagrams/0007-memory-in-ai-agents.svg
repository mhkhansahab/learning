<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="158" viewBox="0 0 1000 158" role="img" aria-labelledby="title description"><title id="title">Lesson workflow</title><desc id="description">Select: Choose what to retain -&gt; Store: Record scope and provenance -&gt; Retrieve: Find relevant memories -&gt; Refresh: Correct or expire old facts</desc><g fill="#202a29" font-family="Arial, sans-serif" font-size="18"><rect x="24" y="24" width="220" height="110" fill="#eef5f2"/><text x="40" y="52" font-weight="600">Select</text><text x="40" y="82" font-size="16">Choose what to retain</text><text x="249" y="79" aria-hidden="true">&#8594;</text><rect x="268" y="24" width="220" height="110" fill="#fbeff1"/><text x="284" y="52" font-weight="600">Store</text><text x="284" y="82" font-size="16">Record scope and</text><text x="284" y="105" font-size="16">provenance</text><text x="493" y="79" aria-hidden="true">&#8594;</text><rect x="512" y="24" width="220" height="110" fill="#eef5f2"/><text x="528" y="52" font-weight="600">Retrieve</text><text x="528" y="82" font-size="16">Find relevant memories</text><text x="737" y="79" aria-hidden="true">&#8594;</text><rect x="756" y="24" width="220" height="110" fill="#fbeff1"/><text x="772" y="52" font-weight="600">Refresh</text><text x="772" y="82" font-size="16">Correct or expire old</text><text x="772" y="105" font-size="16">facts</text></g></svg>
