<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="246" viewBox="0 0 1000 246" role="img" aria-labelledby="title description"><title id="title">Lesson workflow</title><desc id="description">Producer: Submit job -&gt; Durable queue: Buffer pending work -&gt; Worker: Process, then acknowledge; Worker fails: No success acknowledgment -&gt; Retry: Redeliver after timeout / delay -&gt; Dead-letter queue: After configured failure limit</desc><g fill="#202a29" font-family="Arial, sans-serif" font-size="18"><rect x="24" y="24" width="301.3333333333333" height="87" fill="#eef5f2"/><text x="40" y="52" font-weight="600">Producer</text><text x="40" y="82" font-size="16">Submit job</text><text x="330.3333333333333" y="67.5" aria-hidden="true">&#8594;</text><rect x="349.3333333333333" y="24" width="301.3333333333333" height="87" fill="#fbeff1"/><text x="365.3333333333333" y="52" font-weight="600">Durable queue</text><text x="365.3333333333333" y="82" font-size="16">Buffer pending work</text><text x="655.6666666666666" y="67.5" aria-hidden="true">&#8594;</text><rect x="674.6666666666666" y="24" width="301.3333333333333" height="87" fill="#eef5f2"/><text x="690.6666666666666" y="52" font-weight="600">Worker</text><text x="690.6666666666666" y="82" font-size="16">Process, then acknowledge</text><rect x="24" y="135" width="301.3333333333333" height="87" fill="#eef5f2"/><text x="40" y="163" font-weight="600">Worker fails</text><text x="40" y="193" font-size="16">No success acknowledgment</text><text x="330.3333333333333" y="178.5" aria-hidden="true">&#8594;</text><rect x="349.3333333333333" y="135" width="301.3333333333333" height="87" fill="#fbeff1"/><text x="365.3333333333333" y="163" font-weight="600">Retry</text><text x="365.3333333333333" y="193" font-size="16">Redeliver after timeout / delay</text><text x="655.6666666666666" y="178.5" aria-hidden="true">&#8594;</text><rect x="674.6666666666666" y="135" width="301.3333333333333" height="87" fill="#eef5f2"/><text x="690.6666666666666" y="163" font-weight="600">Dead-letter queue</text><text x="690.6666666666666" y="193" font-size="16">After configured failure limit</text></g></svg>
