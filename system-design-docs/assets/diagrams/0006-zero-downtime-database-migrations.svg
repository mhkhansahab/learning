<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="269" viewBox="0 0 1000 269" role="img" aria-labelledby="title description"><title id="title">Lesson workflow</title><desc id="description">Expand: Add compatible schema -&gt; Transition: Deploy compatible code; backfill in batches -&gt; Switch: Verify and use new schema; Compatibility check: Old code and jobs no longer depend on old schema -&gt; Contract: Remove old schema safely</desc><g fill="#202a29" font-family="Arial, sans-serif" font-size="18"><rect x="24" y="24" width="301.3333333333333" height="110" fill="#eef5f2"/><text x="40" y="52" font-weight="600">Expand</text><text x="40" y="82" font-size="16">Add compatible schema</text><text x="330.3333333333333" y="79" aria-hidden="true">&#8594;</text><rect x="349.3333333333333" y="24" width="301.3333333333333" height="110" fill="#fbeff1"/><text x="365.3333333333333" y="52" font-weight="600">Transition</text><text x="365.3333333333333" y="82" font-size="16">Deploy compatible code; backfill</text><text x="365.3333333333333" y="105" font-size="16">in batches</text><text x="655.6666666666666" y="79" aria-hidden="true">&#8594;</text><rect x="674.6666666666666" y="24" width="301.3333333333333" height="110" fill="#eef5f2"/><text x="690.6666666666666" y="52" font-weight="600">Switch</text><text x="690.6666666666666" y="82" font-size="16">Verify and use new schema</text><rect x="24" y="158" width="464" height="87" fill="#eef5f2"/><text x="40" y="186" font-weight="600">Compatibility check</text><text x="40" y="216" font-size="16">Old code and jobs no longer depend on old schema</text><text x="493" y="201.5" aria-hidden="true">&#8594;</text><rect x="512" y="158" width="464" height="87" fill="#fbeff1"/><text x="528" y="186" font-weight="600">Contract</text><text x="528" y="216" font-size="16">Remove old schema safely</text></g></svg>
