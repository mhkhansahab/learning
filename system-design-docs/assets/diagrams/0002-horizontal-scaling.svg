<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="246" viewBox="0 0 1000 246" role="img" aria-labelledby="title description"><title id="title">Lesson workflow</title><desc id="description">Clients: Concurrent requests -&gt; Load balancer: Select a healthy instance -&gt; App pool: App A | App B | App C; Every app instance: Uses shared state -&gt; Database / session store: Data remains available across instances</desc><g fill="#202a29" font-family="Arial, sans-serif" font-size="18"><rect x="24" y="24" width="301.3333333333333" height="87" fill="#eef5f2"/><text x="40" y="52" font-weight="600">Clients</text><text x="40" y="82" font-size="16">Concurrent requests</text><text x="330.3333333333333" y="67.5" aria-hidden="true">&#8594;</text><rect x="349.3333333333333" y="24" width="301.3333333333333" height="87" fill="#fbeff1"/><text x="365.3333333333333" y="52" font-weight="600">Load balancer</text><text x="365.3333333333333" y="82" font-size="16">Select a healthy instance</text><text x="655.6666666666666" y="67.5" aria-hidden="true">&#8594;</text><rect x="674.6666666666666" y="24" width="301.3333333333333" height="87" fill="#eef5f2"/><text x="690.6666666666666" y="52" font-weight="600">App pool</text><text x="690.6666666666666" y="82" font-size="16">App A | App B | App C</text><rect x="24" y="135" width="464" height="87" fill="#eef5f2"/><text x="40" y="163" font-weight="600">Every app instance</text><text x="40" y="193" font-size="16">Uses shared state</text><text x="493" y="178.5" aria-hidden="true">&#8594;</text><rect x="512" y="135" width="464" height="87" fill="#fbeff1"/><text x="528" y="163" font-weight="600">Database / session store</text><text x="528" y="193" font-size="16">Data remains available across instances</text></g></svg>
