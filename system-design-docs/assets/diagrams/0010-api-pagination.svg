<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="246" viewBox="0 0 1000 246" role="img" aria-labelledby="title description"><title id="title">Lesson workflow</title><desc id="description">Client: page_size = 50 + optional cursor -&gt; API: Validate scope and cap size -&gt; Database: Stable order; bounded query; Response: Up to 50 items + next cursor -&gt; Next request: Continue after last sort key</desc><g fill="#202a29" font-family="Arial, sans-serif" font-size="18"><rect x="24" y="24" width="301.3333333333333" height="87" fill="#eef5f2"/><text x="40" y="52" font-weight="600">Client</text><text x="40" y="82" font-size="16">page_size = 50 + optional cursor</text><text x="330.3333333333333" y="67.5" aria-hidden="true">&#8594;</text><rect x="349.3333333333333" y="24" width="301.3333333333333" height="87" fill="#fbeff1"/><text x="365.3333333333333" y="52" font-weight="600">API</text><text x="365.3333333333333" y="82" font-size="16">Validate scope and cap size</text><text x="655.6666666666666" y="67.5" aria-hidden="true">&#8594;</text><rect x="674.6666666666666" y="24" width="301.3333333333333" height="87" fill="#eef5f2"/><text x="690.6666666666666" y="52" font-weight="600">Database</text><text x="690.6666666666666" y="82" font-size="16">Stable order; bounded query</text><rect x="24" y="135" width="464" height="87" fill="#eef5f2"/><text x="40" y="163" font-weight="600">Response</text><text x="40" y="193" font-size="16">Up to 50 items + next cursor</text><text x="493" y="178.5" aria-hidden="true">&#8594;</text><rect x="512" y="135" width="464" height="87" fill="#fbeff1"/><text x="528" y="163" font-weight="600">Next request</text><text x="528" y="193" font-size="16">Continue after last sort key</text></g></svg>
