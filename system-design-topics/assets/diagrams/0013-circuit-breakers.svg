<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="269" viewBox="0 0 1000 269" role="img" aria-labelledby="title description"><title id="title">Lesson workflow</title><desc id="description">Closed: Call dependency normally -&gt; Failure threshold reached: Open the circuit -&gt; Open: Reject calls quickly / safe fallback; After cooldown: Permit limited trial calls -&gt; Half-open: Success: close; failure: reopen</desc><g fill="#202a29" font-family="Arial, sans-serif" font-size="18"><rect x="24" y="24" width="301.3333333333333" height="110" fill="#eef5f2"/><text x="40" y="52" font-weight="600">Closed</text><text x="40" y="82" font-size="16">Call dependency normally</text><text x="330.3333333333333" y="79" aria-hidden="true">&#8594;</text><rect x="349.3333333333333" y="24" width="301.3333333333333" height="110" fill="#fbeff1"/><text x="365.3333333333333" y="52" font-weight="600">Failure threshold reached</text><text x="365.3333333333333" y="82" font-size="16">Open the circuit</text><text x="655.6666666666666" y="79" aria-hidden="true">&#8594;</text><rect x="674.6666666666666" y="24" width="301.3333333333333" height="110" fill="#eef5f2"/><text x="690.6666666666666" y="52" font-weight="600">Open</text><text x="690.6666666666666" y="82" font-size="16">Reject calls quickly / safe</text><text x="690.6666666666666" y="105" font-size="16">fallback</text><rect x="24" y="158" width="464" height="87" fill="#eef5f2"/><text x="40" y="186" font-weight="600">After cooldown</text><text x="40" y="216" font-size="16">Permit limited trial calls</text><text x="493" y="201.5" aria-hidden="true">&#8594;</text><rect x="512" y="158" width="464" height="87" fill="#fbeff1"/><text x="528" y="186" font-weight="600">Half-open</text><text x="528" y="216" font-size="16">Success: close; failure: reopen</text></g></svg>
