<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="246" viewBox="0 0 1000 246" role="img" aria-labelledby="title description"><title id="title">Lesson workflow</title><desc id="description">Client: Send request -&gt; Load balancer: Route using health checks -&gt; Healthy pool: App A and App B receive traffic; App C fails health check: Remove from routing -&gt; Remaining capacity: A and B carry extra traffic</desc><g fill="#202a29" font-family="Arial, sans-serif" font-size="18"><rect x="24" y="24" width="301.3333333333333" height="87" fill="#eef5f2"/><text x="40" y="52" font-weight="600">Client</text><text x="40" y="82" font-size="16">Send request</text><text x="330.3333333333333" y="67.5" aria-hidden="true">&#8594;</text><rect x="349.3333333333333" y="24" width="301.3333333333333" height="87" fill="#fbeff1"/><text x="365.3333333333333" y="52" font-weight="600">Load balancer</text><text x="365.3333333333333" y="82" font-size="16">Route using health checks</text><text x="655.6666666666666" y="67.5" aria-hidden="true">&#8594;</text><rect x="674.6666666666666" y="24" width="301.3333333333333" height="87" fill="#eef5f2"/><text x="690.6666666666666" y="52" font-weight="600">Healthy pool</text><text x="690.6666666666666" y="82" font-size="16">App A and App B receive traffic</text><rect x="24" y="135" width="464" height="87" fill="#eef5f2"/><text x="40" y="163" font-weight="600">App C fails health check</text><text x="40" y="193" font-size="16">Remove from routing</text><text x="493" y="178.5" aria-hidden="true">&#8594;</text><rect x="512" y="135" width="464" height="87" fill="#fbeff1"/><text x="528" y="163" font-weight="600">Remaining capacity</text><text x="528" y="193" font-size="16">A and B carry extra traffic</text></g></svg>
