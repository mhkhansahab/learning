<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="269" viewBox="0 0 1000 269" role="img" aria-labelledby="title description"><title id="title">Lesson workflow</title><desc id="description">Request: Identify caller and operation -&gt; Limit bucket: Check budget / available tokens -&gt; Decision: Allow within budget; otherwise reject; Allowed: Execute bounded work -&gt; Rejected: Return 429; retry guidance when applicable</desc><g fill="#202a29" font-family="Arial, sans-serif" font-size="18"><rect x="24" y="24" width="301.3333333333333" height="110" fill="#eef5f2"/><text x="40" y="52" font-weight="600">Request</text><text x="40" y="82" font-size="16">Identify caller and operation</text><text x="330.3333333333333" y="79" aria-hidden="true">&#8594;</text><rect x="349.3333333333333" y="24" width="301.3333333333333" height="110" fill="#fbeff1"/><text x="365.3333333333333" y="52" font-weight="600">Limit bucket</text><text x="365.3333333333333" y="82" font-size="16">Check budget / available tokens</text><text x="655.6666666666666" y="79" aria-hidden="true">&#8594;</text><rect x="674.6666666666666" y="24" width="301.3333333333333" height="110" fill="#eef5f2"/><text x="690.6666666666666" y="52" font-weight="600">Decision</text><text x="690.6666666666666" y="82" font-size="16">Allow within budget; otherwise</text><text x="690.6666666666666" y="105" font-size="16">reject</text><rect x="24" y="158" width="464" height="87" fill="#eef5f2"/><text x="40" y="186" font-weight="600">Allowed</text><text x="40" y="216" font-size="16">Execute bounded work</text><text x="493" y="201.5" aria-hidden="true">&#8594;</text><rect x="512" y="158" width="464" height="87" fill="#fbeff1"/><text x="528" y="186" font-weight="600">Rejected</text><text x="528" y="216" font-size="16">Return 429; retry guidance when applicable</text></g></svg>
